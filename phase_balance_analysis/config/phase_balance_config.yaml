  },
  "output": {
    "results_dir": "results",
    "save_hourly_detail": true
  },
  "logic_validation": {
    "_说明": "阶段演化趋势只做诊断并写入报告，不按预设排序修改数值或阻止输出。",
    "maximum_preparation_shortage_probability_pct": 5.0,
    "require_sustained_eens_above_impact": true,
    "require_recovery_eens_below_sustained": true,
    "require_recovery_availability_above_sustained": true,
    "require_limited_recovery_curtailment": true,
    "minimum_recovery_curtailment_probability_pct": 1.0,
    "maximum_recovery_curtailment_probability_pct": 20.0
