    "strategy": "prefer_existing",
    "label": "测试阶段划分",
    "require_exact_window_hours": true,
    "stages": [
      {"name": "灾前准备", "order": 1, "start_hour": 0, "end_hour": 5},
      {"name": "灾害冲击", "order": 2, "start_hour": 6, "end_hour": 11},
      {"name": "灾害持续", "order": 3, "start_hour": 12, "end_hour": 23},
      {"name": "灾后恢复", "order": 4, "start_hour": 24, "end_hour": 35}
