  "plotting": {
    "_说明": "白底、蓝灰配色、3:1 超宽扁平图；PNG 以 300 dpi 保存，同时输出 SVG 和 PDF。",
    "dpi": 300,
    "figure_label": "IEEE 33 节点典型仿真结果｜N=200｜测试阶段划分｜非实测数据"
  }
