  "balance": {
    "_说明": "复用第四章完整 SOC/应急电源/网架约束调度模型；只有缺少调度结果时才使用可审计的供需平衡式。",
    "epsilon_mw": 1e-6,
    "time_step_hours": "auto",
    "upstream_resource_config": {
